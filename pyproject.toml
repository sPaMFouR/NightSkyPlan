[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nightskyplan"
version = "0.1.0"
description = "Visibility explorer and baseline observing schedule builder."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "astropy",
    "fastapi",
    "httpx",
    "numpy",
    "pandas",
    "plotly",
    "pydantic",
    "requests",
    "uvicorn[standard]",
]

[tool.setuptools.packages.find]
include = ["nightskyplan*"]
