name: Tests

on:
  push:
    branches:
      - master
      - streamlit-planner
      - web-dev
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest
