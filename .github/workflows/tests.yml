name: Tests

on:
  push:
    branches:
      - master
      - streamlit-planner
      - web-dev
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: webapp/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: webapp/frontend
        run: npm test

      - name: Build frontend
        working-directory: webapp/frontend
        run: npm run build
